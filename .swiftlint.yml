# SwiftLint rules for Senpeng.
# Run locally with `swiftlint --strict`; CI fails on any warning.

included:
  - Senpeng
  - SenpengTests
  - SenpengUITests

excluded:
  - DerivedData
  - .build

# Extra rules on top of SwiftLint's defaults (force_try and force_cast are on by default).
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - sorted_first_last
  - reduce_into
  - toggle_bool
  - redundant_nil_coalescing
  - discouraged_optional_boolean
  - legacy_objc_type
  - modifier_order
  - closure_spacing
  - vertical_whitespace_closing_braces
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - explicit_init
  - prefer_self_type_over_type_of_self

disabled_rules:
  # TODOs are allowed when they explain the reason (see CLAUDE.md).
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

identifier_name:
  excluded:
    - id
    - x
    - y

custom_rules:
  no_print:
    name: "No print"
    regex: '\bprint\('
    message: "Use os.Logger instead of print."
    severity: error
